AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Spry monthly AWS Budgets alarm (Lab 6). CloudFormation offers AWS::Budgets::Budget only in
  us-east-1, so this stack lives there; the budget itself covers the whole account.

Parameters:
  ProjectName:
    Type: String
    Default: spry
  BudgetEmail:
    Type: String
    AllowedPattern: "^[^@\\s]+@[^@\\s]+$"
  BudgetAmount:
    Type: Number
    Default: 5

Resources:
  # The cheapest insurance in the course: an email when the month's actual or forecast spend on
  # this account passes the limit.
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub ${ProjectName}-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetAmount
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

